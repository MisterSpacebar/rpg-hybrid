name: Validate Firestore Market Rules

on:
  push:
    paths:
      - 'app/firestore.rules'
      - 'app/scripts/firestore-market-rules.mjs'
      - 'app/src/campaign/**/market*'
      - '.github/workflows/firestore-market-rules.yml'
  pull_request:
    paths:
      - 'app/firestore.rules'
      - 'app/scripts/firestore-market-rules.mjs'
      - 'app/src/campaign/**/market*'
      - '.github/workflows/firestore-market-rules.yml'

jobs:
  firestore-market-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies and emulator
        working-directory: app
        run: |
          npm ci
          npm install --no-save --legacy-peer-deps @firebase/rules-unit-testing
          npm install --global firebase-tools
      - name: Check market transactions against actual Firestore rules
        working-directory: app
        run: firebase emulators:exec --project demo-rpg-market --only firestore "node scripts/firestore-market-rules.mjs"
